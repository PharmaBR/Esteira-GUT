[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "esteira.tests.settings"
python_files = ["test_*.py"]
testpaths = ["esteira/tests"]
addopts = "-q"
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["esteira/boards/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
