<li class="card task editing" id="task-{{ task.pk }}">
  <form method="post" action="{% url 'task-edit' task.pk %}" class="task-form" novalidate
        hx-post="{% url 'task-edit' task.pk %}" hx-target="#board" hx-swap="outerHTML"
        hx-indicator="this" hx-disabled-elt="find button">
    {% csrf_token %}
    {% include "boards/_task_fields.html" %}
    <div class="actions">
      <button type="submit" class="btn btn-primary">Salvar<span class="spinner htmx-indicator" aria-hidden="true"></span></button>
      <a class="btn" href="{{ board.get_absolute_url }}"
         hx-get="{{ board.get_absolute_url }}" hx-target="#board" hx-swap="outerHTML"
         hx-indicator="this" hx-disabled-elt="this">Cancelar<span class="spinner htmx-indicator" aria-hidden="true"></span></a>
    </div>
  </form>
</li>
